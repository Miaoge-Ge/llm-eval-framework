[project]
name = "llm-eval-framework"
version = "0.1.0"
description = "Engineering-first evaluation framework for LLM benchmarking across code and reasoning tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.52.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"
